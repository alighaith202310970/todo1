<!DOCTYPE html>
<html>
<head>
    <title>My Tasks</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<div class="toggle" onclick="toggleMode()">🌙</div>

<div class="container">
    <h1>⚡ Ultimate Todo</h1>

    <form method="POST">
        <input name="title" placeholder="🔥 Task..." required>
        <input name="description" placeholder="💡 Description">
        <select name="priority">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
        </select>
        <button>Add</button>
    </form>

    {% for todo in todos %}
    <div class="card {{ todo[4] }}">
        <div class="todo">
            <div class="todo-text {% if todo[3] %}done{% endif %}">
                <h3>{{ todo[1] }}</h3>
                <p>{{ todo[2] }}</p>
            </div>

            <div>
                <a href="/done/{{ todo[0] }}"><button>✔</button></a>
                <a href="/edit/{{ todo[0] }}"><button>✏️</button></a>
                <a href="/delete/{{ todo[0] }}"><button class="delete-btn">🗑</button></a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>

<script>
function toggleMode() {
    document.body.classList.toggle("dark");
}
</script>
</body>
</html>
